<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Mesa 04 - Açaí Victorino</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root {
            --acai-dark: #2e003e;
            --acai-primary: #6c1e96;
            --fresh-green: #00b894;
            --white: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            background: #f0f0f0;
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .table-card {
            width: 320px;
            height: 500px;
            background: var(--white);
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(46, 0, 62, 0.2);
            overflow: hidden;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .header {
            width: 100%;
            height: 140px;
            background: linear-gradient(135deg, var(--acai-dark) 0%, var(--acai-primary) 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            z-index: 1;
        }
        
        .header::after {
            content: "";
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 40px;
            background: var(--white);
            border-radius: 100% 0 0 0 / 100px 0 0 0;
            z-index: 2;
        }

        .mesa-badge {
            margin-top: -30px;
            background: var(--fresh-green);
            color: var(--white);
            padding: 8px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.5rem;
            text-transform: uppercase;
            box-shadow: 0 5px 15px rgba(0, 184, 148, 0.4);
            z-index: 10;
            border: 4px solid var(--white);
        }

        .logo-text {
            color: var(--white);
            font-weight: 800;
            font-size: 1.8rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }

        .qr-container {
            margin-top: 30px;
            padding: 10px;
            border: 2px dashed var(--acai-primary);
            border-radius: 20px;
        }

        .qr-code {
            width: 180px;
            height: 180px;
            display: block;
            border-radius: 10px;
        }

        .cta {
            margin-top: 20px;
            color: var(--acai-dark);
        }
        .cta h3 {
            margin: 0;
            font-weight: 800;
            font-size: 1.2rem;
        }
        .cta p {
            margin: 5px 0 0;
            font-size: 0.9rem;
            color: #666;
        }

        .footer {
            margin-top: auto;
            width: 100%;
            padding: 15px;
            background: #f9f9f9;
            border-top: 1px solid #eee;
            font-size: 0.75rem;
            color: #888;
        }

        .dev-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(108, 30, 150, 0.1);
            padding: 5px 12px;
            border-radius: 15px;
            text-decoration: none;
            color: var(--acai-primary);
            font-weight: 600;
            transition: 0.3s;
        }
        
        .material-icons { font-size: 14px; vertical-align: middle; }

        @media print {
            body { background: none; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
            .table-card { box-shadow: none; border: 1px solid #ddd; }
        }
    </style>
</head>
<body>

    <div class="table-card">
        <div class="header">
            <div class="logo-text">AÇAÍ VICTORINO</div>
        </div>
        
        <div class="mesa-badge">MESA 04</div>

        <div class="qr-container">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&color=2e003e&bgcolor=ffffff&data=https://developegoncalves.github.io/acai-teste/mesa04.html" class="qr-code" alt="QR Mesa 04">
        </div>

        <div class="cta">
            <h3>Cardápio Digital</h3>
            <p>Aponte a câmera para pedir</p>
        </div>

        <div class="footer">
            <a href="https://victorinoeng.com.br/" class="dev-badge">
                <span class="material-icons">code</span> Dev: <strong>Victorino.eng</strong>
            </a>
            <div style="margin-top: 4px; font-size: 0.65rem;">victorinoeng.com.br</div>
        </div>
    </div>

</body>
</html>
