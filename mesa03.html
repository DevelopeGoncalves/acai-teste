<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cardápio Digital | Açaí Victorino</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <style>
        :root { --bg: #0d0d12; --card-bg: rgba(30, 30, 40, 0.6); --primary: #a855f7; --accent: #10b981; --text: #ffffff; --gray: #9ca3af; --glass: blur(12px) saturate(180%); }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text); padding-bottom: 120px; background-image: radial-gradient(circle at top right, #2e1065 0%, transparent 40%); }
        header { height: 220px; position: relative; overflow: hidden; border-bottom-left-radius: 30px; border-bottom-right-radius: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .header-bg { width: 100%; height: 100%; object-fit: cover; opacity: 0.7; background: url('img/capa.webp') center/cover no-repeat; }
        .header-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, var(--bg) 100%); display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .logo { font-size: 2.2rem; font-weight: 800; color: #fff; text-transform: uppercase; letter-spacing: 2px; text-shadow: 0 4px 15px rgba(0,0,0,0.8); margin-bottom: 5px; text-align: center; }
        .subtitle { font-size: 1rem; color: #e0e0e0; font-weight: 400; text-shadow: 0 2px 5px rgba(0,0,0,0.8); }
        .container { max-width: 600px; margin: -30px auto 0; padding: 0 20px; position: relative; z-index: 10; }
        .mesa-badge { background: rgba(255,255,255,0.08); backdrop-filter: var(--glass); border: 1px solid rgba(255,255,255,0.1); padding: 15px 25px; border-radius: 50px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .mesa-info { display: flex; align-items: center; gap: 10px; }
        .mesa-numero { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
        .neon-input { width: 100%; padding: 18px; background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); border-radius: 15px; color: white; font-size: 1rem; outline: none; transition: 0.3s; margin-bottom: 30px; }
        .neon-input:focus { border-color: var(--primary); background: rgba(168, 85, 247, 0.1); }
        h3.section-title { font-size: 1.1rem; color: #fff; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; }
        h3.section-title::before { content:''; width: 6px; height: 24px; background: var(--primary); border-radius: 4px; }
        .grid-sizes { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 30px; }
        .size-card { background: var(--card-bg); padding: 25px 15px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; position: relative; }
        .size-card h4 { font-size: 1.3rem; margin-bottom: 5px; font-weight: 600; }
        .size-card p { color: var(--gray); font-size: 0.9rem; }
        .size-card.selected { border-color: var(--primary); background: rgba(168, 85, 247, 0.15); box-shadow: 0 0 20px rgba(168, 85, 247, 0.2); transform: translateY(-3px); }
        .size-card.selected h4 { color: var(--primary); }
        .chips-container { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; }
        .chip { padding: 10px 18px; background: rgba(255,255,255,0.05); border-radius: 50px; font-size: 0.9rem; color: #ddd; border: 1px solid transparent; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; }
        .chip i { font-size: 1rem; opacity: 0.5; transition: 0.2s; }
        .chip.selected { background: var(--accent); color: #003320; border-color: var(--accent); font-weight: 600; }
        .chip.selected i { opacity: 1; }
        .chip.disabled, .premium-item.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(1); position: relative; border: 1px dashed #555; }
        .chip.disabled::after, .premium-item.disabled::after { content: 'ESGOTADO'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%) rotate(-10deg); background: #d32f2f; color: white; padding: 2px 5px; font-size: 0.6rem; border-radius: 4px; font-weight: bold; z-index: 10; }
        .premium-item { display: flex; justify-content: space-between; align-items: center; padding: 15px 20px; background: var(--card-bg); margin-bottom: 10px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.2s; position: relative; }
        .premium-item:hover { background: rgba(255,255,255,0.1); }
        .premium-item.selected { border-color: var(--primary); background: rgba(168, 85, 247, 0.1); }
        .plus-btn { width: 28px; height: 28px; background: rgba(255,255,255,0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; transition: 0.2s; }
        .premium-item.selected .plus-btn { background: var(--primary); transform: rotate(45deg); }
        .bottom-bar { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 550px; background: rgba(20, 20, 25, 0.9); backdrop-filter: blur(15px); padding: 15px 20px; border-radius: 60px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between; box-shadow: 0 10px 40px rgba(0,0,0,0.6); z-index: 100; }
        .total-box { display: flex; flex-direction: column; padding-left: 10px; }
        .total-box span { font-size: 0.75rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; }
        .total-box strong { font-size: 1.4rem; color: #fff; }
        .btn-order { background: var(--primary); color: white; border: none; padding: 15px 35px; border-radius: 40px; font-weight: 600; font-size: 1rem; cursor: pointer; box-shadow: 0 5px 20px rgba(168, 85, 247, 0.4); transition: 0.3s; }
        .btn-order:disabled { background: #333; color: #555; box-shadow: none; cursor: not-allowed; }
        
        /* Estilo do Rodapé Victorino.eng */
        .footer-dev { text-align: center; margin-bottom: 40px; opacity: 0.6; padding-bottom: 20px; }
        .footer-dev a { text-decoration: none; color: var(--gray); display: inline-flex; align-items: center; gap: 8px; font-size: 0.8rem; transition: 0.3s; }
        .footer-dev a:hover { color: var(--primary); opacity: 1; }
        .footer-dev img { width: 25px; height: 25px; border-radius: 50%; border: 1px solid var(--accent); }

        @keyframes fadeUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-up { animation: fadeUp 0.5s ease forwards; opacity: 0; }
        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 12px 30px; border-radius: 50px; font-weight: 600; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 2000; box-shadow: 0 10px 30px rgba(255,255,255,0.2); }
        .toast.show { opacity: 1; top: 40px; }
    </style>
</head>
<body>
    <header>
        <div class="header-bg"></div>
        <div class="header-overlay"><div class="logo">AÇAÍ VICTORINO</div><div class="subtitle">O melhor açaí da região</div></div>
    </header>

    <div class="container">
        <div class="mesa-badge animate-up" style="animation-delay: 0.1s;"><div class="mesa-info"><i class="material-icons" style="color: var(--primary);">table_restaurant</i><span style="color: #ddd;">Você está na</span></div><div class="mesa-numero" id="display-mesa">--</div></div>
        <input type="text" id="cliente-nome" class="neon-input animate-up" style="animation-delay: 0.2s;" placeholder="Qual seu nome?" onkeyup="validar()">
        
        <h3 class="section-title animate-up" style="animation-delay: 0.3s;">1. Escolha o Tamanho</h3>
        <div class="grid-sizes animate-up" style="animation-delay: 0.4s;" id="grid-sizes">
            <p style="color:#666;">Carregando cardápio...</p>
        </div>

        <h3 class="section-title animate-up" style="animation-delay: 0.5s;">2. Grátis (Max 3)</h3>
        <div class="chips-container animate-up" style="animation-delay: 0.6s;" id="lista-gratis"></div>

        <h3 class="section-title animate-up" style="animation-delay: 0.7s;">3. Turbinar (Pago)</h3>
        <div class="animate-up" style="animation-delay: 0.8s;" id="lista-pagos"></div>

        <div class="footer-dev animate-up" style="animation-delay: 0.9s;">
            <a href="https://victorinoeng.com.br/" target="_blank">
                <img src="img/logo.png" alt="Victorino.eng"><span>Desenvolvido por <strong>Victorino.eng</strong></span>
            </a>
        </div>
    </div>

    <div class="bottom-bar"><div class="total-box"><span>Total</span><strong id="display-total">R$ 0,00</strong></div><button class="btn-order" id="btn-enviar" onclick="enviarPedido()" disabled>ENVIAR <i class="material-icons" style="font-size: 1.1rem; margin-left:5px;">arrow_forward</i></button></div>
    <div class="toast" id="toast">Adicionado!</div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, get } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // --- COLOQUE SUA CONFIGURAÇÃO AQUI ---
        const firebaseConfig = {
        apiKey: "AIzaSyAZXNqxuUyKACvDRuRYXUdzrUpVUl8K0JU",
        authDomain: "acaivictorino-amostra.firebaseapp.com",
        projectId: "acaivictorino-amostra",
        storageBucket: "acaivictorino-amostra.firebasestorage.app",
        messagingSenderId: "1085066202451",
        appId: "1:1085066202451:web:5768ce3d9c2dc7a304a5a6"
        };
        // -------------------------------------

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        window.enviarPedido = enviarPedidoFunc;
        window.selectSize = selectSize;
        window.toggleGratis = toggleGratis;
        window.togglePago = togglePago;
        window.validar = validar;

        let pedido = { mesa: '', cliente: '', tamanho: null, precoBase: 0, gratis: [], pagos: [] };
        let estoque = [];
        let bloqueados = [];

        window.onload = () => {
            detectarMesa();
            
            // Carrega tudo do Firebase (Produtos + Bloqueios)
            onValue(ref(db, 'bloqueios'), (snap) => {
                bloqueados = snap.val() || [];
                if(estoque.length > 0) renderCardapio();
            });

            onValue(ref(db, 'estoque'), (snap) => {
                estoque = snap.val() || [];
                renderCardapio();
            });
        };

        function detectingFileName() {
            const path = window.location.pathname; 
            const file = path.substring(path.lastIndexOf('/')+1);
            const match = file.match(/mesa(\d+)/i);
            if(match) return match[1];
            return null;
        }

        function detectarMesa() {
            let numMesa = detectingFileName();
            if (!numMesa) numMesa = prompt("Digite o número da mesa (ex: 01):") || "00";
            pedido.mesa = numMesa;
            document.getElementById('display-mesa').innerText = numMesa;
        }

        function renderCardapio() {
            // 1. TAMANHOS (Categoria 'Copo')
            const tamanhos = estoque.filter(p => p.cat === 'Copo');
            document.getElementById('grid-sizes').innerHTML = tamanhos.map(p => {
                let imgNome = "";
                const nomeLower = p.nome.toLowerCase();

                // Lógica de identificação aprimorada
                if (nomeLower.includes("300")) {
                    imgNome = "300ml.webp";
                } else if (nomeLower.includes("500")) {
                    imgNome = "500ml.webp";
                } else if (nomeLower.includes("700")) {
                    imgNome = "700ml.webp";
                } else if (nomeLower.includes("1l") || nomeLower.includes("1 l") || nomeLower.includes("1litro") || nomeLower.includes("1 litro") || nomeLower.includes("1000")) {
                    imgNome = "1l.webp";
                } else {
                    imgNome = "default-copo.webp"; 
                }

                return `
                <div class="size-card" onclick="selectSize('${p.nome}', ${p.preco})" style="padding: 0; overflow: hidden; display: flex; flex-direction: column; height: 100%;">
                    <div style="width: 100%; height: 140px; background: rgba(0,0,0,0.2); display: flex; align-items: center; justify-content: center; border-radius: 20px 20px 0 0; overflow: hidden;">
                        <img src="img/${imgNome}" 
                             alt="${p.nome}" 
                             style="width: 100%; height: 100%; object-fit: cover;" 
                             onerror="this.src='img/default-copo.webp';">
                    </div>
                    <div style="padding: 12px 5px;">
                        <h4 style="margin:0; font-size: 1.1rem;">${p.nome.replace('Açaí ', '')}</h4> 
                        <p style="margin:5px 0 0 0; color: var(--primary); font-weight: bold;">R$ ${p.preco.toFixed(2)}</p>
                    </div>
                </div>
            `}).join('');

            // 2. GRÁTIS (Categoria 'Adicional' + Preço 0)
            const gratis = estoque.filter(p => p.cat === 'Adicional' && p.preco === 0);
            document.getElementById('lista-gratis').innerHTML = gratis.map(item => {
                const isBlocked = bloqueados.includes(item.nome);
                return `
                <div class="chip ${isBlocked ? 'disabled' : ''}" onclick="toggleGratis(this, '${item.nome}')">
                    <i class="material-icons" style="font-size:1rem;">star</i>
                    ${item.nome}
                </div>
            `}).join('');

            // 3. PAGOS (Categoria 'Adicional' + Preço > 0)
            const pagos = estoque.filter(p => p.cat === 'Adicional' && p.preco > 0);
            document.getElementById('lista-pagos').innerHTML = pagos.map(item => {
                const isBlocked = bloqueados.includes(item.nome);
                return `
                <div class="premium-item ${isBlocked ? 'disabled' : ''}" onclick="togglePago(this, '${item.nome}', ${item.preco})">
                    <div>
                        <div style="font-weight:600;">${item.nome}</div>
                        <small style="color: var(--accent);">+ R$ ${item.preco.toFixed(2)}</small>
                    </div>
                    <div class="plus-btn"><i class="material-icons">add</i></div>
                </div>
            `}).join('');
        }

        function selectSize(tamanho, preco) {
            document.querySelectorAll('.size-card').forEach(c => c.classList.remove('selected'));
            event.currentTarget.classList.add('selected');
            pedido.tamanho = tamanho;
            pedido.precoBase = preco;
            calcularTotal();
        }

        function toggleGratis(el, nome) {
            if(el.classList.contains('disabled')) return;
            if (pedido.gratis.includes(nome)) {
                pedido.gratis = pedido.gratis.filter(i => i !== nome);
                el.classList.remove('selected');
            } else {
                if(pedido.gratis.length >= 3) return showToast("Máximo de 3 itens!", true);
                pedido.gratis.push(nome);
                el.classList.add('selected');
            }
        }

        function togglePago(el, nome, preco) {
            if(el.classList.contains('disabled')) return;
            const exists = pedido.pagos.find(p => p.nome === nome);
            if (exists) {
                pedido.pagos = pedido.pagos.filter(p => p.nome !== nome);
                el.classList.remove('selected');
            } else {
                pedido.pagos.push({ nome, preco });
                el.classList.add('selected');
            }
            calcularTotal();
        }

        function calcularTotal() {
            let total = pedido.precoBase;
            pedido.pagos.forEach(p => total += p.preco);
            document.getElementById('display-total').innerText = total.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});
            validar();
        }

        function validar() {
            const nome = document.getElementById('cliente-nome').value.trim();
            pedido.cliente = nome;
            document.getElementById('btn-enviar').disabled = !(nome.length > 2 && pedido.tamanho);
        }

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2000);
        }

        function enviarPedidoFunc() {
            let listaItens = [...pedido.gratis];
            pedido.pagos.forEach(p => listaItens.push(`${p.nome} (+R$${p.preco})`));

            const novoPedido = {
                id: Date.now(), mesa: pedido.mesa, cliente: pedido.cliente, tamanho: pedido.tamanho,
                itens: listaItens, total: document.getElementById('display-total').innerText,
                hora: new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'})
            };

            get(ref(db, 'pedidosAtivos')).then((snapshot) => {
                let ativos = snapshot.val() || [];
                ativos.push(novoPedido);
                set(ref(db, 'pedidosAtivos'), ativos)
                .then(() => {
                    document.body.innerHTML = `
                        <div style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:30px; background:var(--bg);">
                            <div style="width:80px; height:80px; background:rgba(16, 185, 129, 0.2); border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
                                <i class="material-icons" style="font-size: 3rem; color: var(--accent);">check</i>
                            </div>
                            <h2 style="color:white; margin-bottom:10px;">Pedido Recebido!</h2>
                            <p style="color:var(--gray);">Fique tranquilo(a) na <strong>Mesa ${pedido.mesa}</strong>.<br>Logo seu açaí chega.</p>
                            <button onclick="window.location.reload()" style="margin-top:30px; padding:12px 25px; background:transparent; border:1px solid #333; color:#fff; border-radius:50px; cursor:pointer;">Novo Pedido</button>
                            <div class="footer-dev" style="margin-top: 50px;">
                                <a href="https://victorinoeng.com.br/" target="_blank">
                                    <img src="img/logo.png" alt="V"> Desenvolvido por <strong>Victorino.eng</strong>
                                </a>
                            </div>
                        </div>
                    `;
                })
                .catch((error) => alert("Erro ao enviar: " + error.message));
            });
        }
    </script>
</body>
</html>
